# Render configuration. Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: rashaross
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_USERNAME
        sync: false          # sender email address
      - key: MAIL_PASSWORD
        sync: false          # Gmail app password
      - key: DIGEST_RECIPIENT
        sync: false          # where the weekly subscriber list is sent
  - type: cron
    name: weekly-digest
    runtime: python
    schedule: "0 8 * * 0"    # Sundays 08:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/weekly_digest.py
    envVars:
      - fromService: {type: web, name: rashaross, envVarKey: SECRET_KEY}
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: DIGEST_RECIPIENT
        sync: false
